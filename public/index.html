<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#ee2036"><title>ABC Cargas | Fleet Control Web</title><link rel="stylesheet" href="/styles.css"></head>
<body>
<div id="authGate" class="authGate"><form id="loginForm" class="authCard"><div class="brandText"><b>ABC</b><span>CARGAS</span></div><h1>Acesso ao Fleet Control</h1><p>Gestão da frota de veículos leves</p><div id="authError" class="formError" role="alert"></div><label>E-mail<input name="email" id="loginEmail" type="email" autocomplete="username" required></label><label>Senha<input name="password" id="loginPassword" type="password" autocomplete="current-password" required></label><button class="primary" id="loginButton">Entrar</button><small id="connectionMessage">Conectando ao sistema…</small></form></div>
<div id="app" class="app hidden"><aside class="sidebar"><a class="brand" href="#dashboard" aria-label="ABC Cargas"><div class="brandLogo" aria-hidden="true"></div></a><nav id="navigation"></nav><div class="sideBottom"><div class="online"><i></i><strong id="saveStatus">Sistema online</strong></div><small id="lastSync"></small><button class="textButton" data-action="refresh">Atualizar dados</button></div></aside><header class="header"><button class="iconButton mobileMenu" data-action="menu" aria-label="Abrir menu">☰</button><div class="searchWrap"><span>⌕</span><input id="globalSearch" placeholder="Buscar placa, modelo ou motorista…" aria-label="Buscar veículo"></div><button class="iconButton bell" data-action="notifications" aria-label="Alertas"><svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M5 16V9a7 7 0 0114 0v7l2 3H3z M9 22h6"/></svg><span id="alertBadge"></span></button><button class="profile" data-action="profile"><span class="avatar" id="avatar">US</span><span><strong id="userName"></strong><small>Gestão de frota</small></span><span>⌄</span></button></header><main id="content" tabindex="-1"></main></div>
<div id="modalBackdrop" class="modalBackdrop hidden"><section class="modal" role="dialog" aria-modal="true" aria-labelledby="modalTitle"><header><h2 id="modalTitle"></h2><button class="iconButton" data-action="close" aria-label="Fechar">×</button></header><div id="modalBody"></div></section></div><div id="toast" role="status"></div><script type="module" src="/app.js"></script></body></html>
